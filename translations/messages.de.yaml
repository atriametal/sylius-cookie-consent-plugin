# The texts of the banner and the preferences are translated by florentingarnier/cookie-consent-bundle: the
# plugin only words those about the purposes for a shop.
florentin_garnier_cookie_consent:
    banner:
        text: >-
            Mit Ihrer Einwilligung verwenden wir Cookies, um die Nutzung des Shops zu messen, Videos anzuzeigen und
            unsere Werbung zu messen. Sie können Ihre Wahl jederzeit über den Link „Cookie-Einstellungen“ unten auf
            jeder Seite ändern.
    preferences:
        text: Wählen Sie die Cookies, die Sie akzeptieren. Ihre Wahl gilt für den gesamten Shop.
    categories:
        necessary:
            description: Warenkorb, Kundenkonto, sichere Zahlung und Speicherung Ihrer Wahl. Ohne sie funktioniert der Shop nicht.
        analytics:
            description: Erfahren, welche Seiten besucht werden, um den Shop zu verbessern.

atriametal_cookie_consent:
    ui:
        consent_records: Cookie-Einwilligungen
        consent_records_subheader: Nachweis der Entscheidungen der Besucher
        consent_id_column: Einwilligungskennung
        date: Datum
        granted_categories: Akzeptierte Zwecke
        policy_version: Version der Richtlinie
